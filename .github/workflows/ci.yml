name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Generated calendars match data/
        # Proves offline that the shipped calendar is exactly what data/*.json
        # says, so nobody has to trust whoever ran the generator.
        run: npm run check:generated
      - run: npm run build
      - run: npm run test:coverage

  test-matrix:
    name: Node ${{ matrix.node }} · TZ=${{ matrix.tz }}
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.tz }}
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        tz: [UTC, Europe/London]
        include:
          # Offsets chosen to break specific wrong assumptions: negative whole
          # and half hours, a 45-minute offset, a 30-minute DST step, and a zone
          # that is a day ahead of UTC.
          - node: 22
            tz: America/New_York
          - node: 22
            tz: America/St_Johns
          - node: 22
            tz: Asia/Kolkata
          - node: 22
            tz: Pacific/Chatham
          - node: 22
            tz: Australia/Lord_Howe
          - node: 22
            tz: Pacific/Kiritimati
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck-consumers:
    name: TypeScript ${{ matrix.ts }} · ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        ts: ['4.8', '5.0', '5.5', 'latest']
        fixture: [ts48, cjs-node16, verbatim-bundler, es5-target]
        exclude:
          # verbatimModuleSyntax did not exist before TypeScript 5.0.
          - ts: '4.8'
            fixture: verbatim-bundler
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Typecheck a consumer on TypeScript ${{ matrix.ts }}
        working-directory: test/typecheck/${{ matrix.fixture }}
        run: |
          npm install --no-save --no-package-lock typescript@${{ matrix.ts }}
          npx tsc --noEmit

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: publint
        run: npx publint --strict

      - name: Are the types wrong?
        run: npx --yes @arethetypeswrong/cli --pack .

      - name: Pack
        run: npm pack --ignore-scripts

      - name: Install the tarball into a clean project
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/market-hours-*.tgz

      - name: Import it as ESM and require it as CommonJS
        # The check that catches an ESM-only package breaking every CommonJS
        # consumer, which no amount of unit testing inside the repo would.
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/scripts/smoke/smoke.mjs /tmp/consumer/
          cp "$GITHUB_WORKSPACE"/scripts/smoke/smoke.cjs /tmp/consumer/
          cd /tmp/consumer
          node smoke.mjs
          node smoke.cjs

      - name: Size budget
        # Measured per format, because a consumer only ever loads one of them.
        # Most of it is the calendar itself, which is the point of the package.
        run: |
          set -euo pipefail
          for format in esm cjs; do
            bytes=$(find "dist/$format" -name '*.js' -exec cat {} + | wc -c)
            gzipped=$(find "dist/$format" -name '*.js' -exec cat {} + | gzip -9 | wc -c)
            echo "$format: ${bytes} bytes (${gzipped} gzipped)"
            if [ "$bytes" -gt 98304 ]; then
              echo "::error::dist/$format exceeds the 96 KB budget"
              exit 1
            fi
          done
