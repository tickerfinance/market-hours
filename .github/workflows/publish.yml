name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance, which links the published tarball back to this
  # workflow run and the commit it was built from.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Packaging checks
        run: |
          npx publint --strict
          npx --yes @arethetypeswrong/cli --pack .

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          version=$(node -p 'require("./package.json").version')
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release tag ${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Check the calendar is not already stale
        run: node scripts/check-calendar-freshness.mjs

      # npm versions are immutable, so re-running a release — or creating one
      # for a version that was published by hand — would fail with E403 and
      # leave a red run against a release that is perfectly fine. Skip instead.
      - name: Is this version already on the registry?
        id: registry
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
