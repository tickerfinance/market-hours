name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance, which links the published tarball back to this
  # workflow run and the commit it was built from.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify
        run: npm run verify

      - name: Packaging checks
        run: |
          npx publint --strict
          npx --yes @arethetypeswrong/cli --pack .

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag='${{ github.event.release.tag_name }}'
          version=$(node -p 'require("./package.json").version')
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release tag ${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Check the calendar is not already stale
        run: node scripts/check-calendar-freshness.mjs

      # npm versions are immutable, so re-running a release — or creating one
      # for a version that was published by hand — would fail with E403 and
      # leave a red run against a release that is perfectly fine. Skip instead.
      - name: Is this version already on the registry?
        id: registry
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published; nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # actions/setup-node ships the npm that came with the Node release, which
      # for Node 22 is 10.x. Trusted publishing needs 11.5.1 or newer: older
      # CLIs do not attempt the OIDC exchange at all, and the registry rejects
      # the unauthenticated request as `404 Not Found - PUT`, which reads like
      # the package does not exist rather than like an auth failure.
      #
      # Upgraded here rather than before `npm ci`, so the rest of the job runs
      # on the npm this project is actually tested against.
      - if: steps.registry.outputs.published == 'false'
        run: npm install -g npm@latest

      # No token. This repository is a registered trusted publisher for the
      # package, so the npm CLI exchanges the workflow's OIDC identity for a
      # short-lived credential and generates the provenance attestation itself
      # — which is why `--provenance` is not passed either.
      #
      # `publishConfig.provenance` stays true in package.json on purpose: it
      # makes a publish from anyone's laptop fail rather than quietly shipping
      # an unattested tarball.
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --access public
